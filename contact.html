<style>
/* =========================================================
   ForexProfitPathways — Theme (matches current live-site brand)
   Gold / dark, Playfair Display + DM Sans
   ========================================================= */
:root{
  --gold: #C9A84C;
  --gold-light: #F0D080;
  --gold-dark: #8A6A1F;
  --dark: #0A0D12;
  --dark2: #10141C;
  --dark3: #181E2A;
  --card: #141920;
  --card-hover: #1a2030;
  --text: #E8E4D9;
  --text-muted: #8A8F9A;
  --green: #2ECC71;
  --red: #E74C3C;
  --accent: #1A6EFF;
  --border: rgba(255,255,255,.06);
  --border-gold: rgba(201,168,76,.3);

  --font-display: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;

  --container: 1180px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; scroll-padding-top:84px; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

body{
  margin:0;
  background:var(--dark);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}

/* Noise texture overlay — matches current site */
body::before{
  content:'';
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:0; opacity:.3;
}

h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:700;
  line-height:1.15;
  margin:0 0 .5em;
}
h1{ font-weight:900; font-size:clamp(2.4rem, 4.8vw, 4rem); }
h2{ font-size:clamp(1.8rem, 3.2vw, 2.6rem); }
h3{ font-size:1.15rem; font-weight:600; font-family:var(--font-body); }
p{ margin:0 0 1em; color:var(--text-muted); }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; padding:0; margin:0; }
img{ max-width:100%; display:block; }

.container{ max-width:var(--container); margin:0 auto; padding:0 24px; position:relative; z-index:1; }
.container-narrow{ max-width:760px; }

.skip-link{
  position:absolute; left:-999px; top:0; background:var(--gold); color:#000;
  padding:10px 16px; z-index:300; border-radius:0 0 8px 0;
}
.skip-link:focus{ left:0; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

.eyebrow{
  font-size:.75rem; font-weight:600; letter-spacing:2.5px; text-transform:uppercase;
  color:var(--gold); margin:0 0 .9em;
}

/* =========================================================
   Buttons
   ========================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:15px 32px; border-radius:8px;
  font-family:var(--font-body); font-weight:700; font-size:.98rem;
  border:1px solid transparent; cursor:pointer;
  transition:transform .2s ease, box-shadow .3s ease, background .3s ease, border-color .3s ease;
  white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(135deg, var(--gold), var(--gold-dark));
  color:#000;
  box-shadow:0 4px 24px rgba(201,168,76,.32);
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 32px rgba(201,168,76,.48); }
.btn-ghost{ background:transparent; color:var(--text); border-color:rgba(255,255,255,.15); }
.btn-ghost:hover{ border-color:var(--gold); background:rgba(201,168,76,.08); }
.btn-outline{ background:transparent; color:var(--gold); border-color:var(--border-gold); }
.btn-outline:hover{ background:rgba(201,168,76,.08); }
.btn-block{ width:100%; }

/* =========================================================
   Header / Nav
   ========================================================= */
.site-header{
  position:sticky; top:0; z-index:100;
  background:rgba(10,13,18,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-gold);
  transition:border-color .3s ease;
}
.nav{
  max-width:var(--container); margin:0 auto; padding:18px 24px;
  display:flex; align-items:center; justify-content:space-between;
}
.nav-brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  font-family:var(--font-display); font-weight:700; font-size:.85rem;
  background:rgba(201,168,76,.12); color:var(--gold);
  padding:6px 10px; border-radius:6px; letter-spacing:.05em;
  border:1px solid var(--border-gold);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--gold); }

.nav-menu{ display:flex; align-items:center; gap:32px; }
.nav-links{ display:flex; gap:32px; }
.nav-links a{ font-size:.85rem; font-weight:500; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); transition:color .3s ease; }
.nav-links a:hover{ color:var(--gold); }

.nav-cta{ padding:10px 24px !important; font-size:.9rem !important; }

.nav-toggle{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:8px; }
.nav-toggle span{ width:22px; height:2px; background:var(--gold); display:block; transition:transform .25s ease, opacity .25s ease; }

/* =========================================================
   Hero
   ========================================================= */
.hero{
  padding:130px 0 70px;
  position:relative;
}
.hero::before{
  content:'';
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 65% 40%, rgba(201,168,76,.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 90% 15%, rgba(26,110,255,.06) 0%, transparent 60%);
}
.hero-inner{
  display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center;
  position:relative; z-index:1;
}
.hero-sub{ font-size:1.1rem; max-width:46ch; line-height:1.7; }
.hero-actions{ display:flex; gap:16px; flex-wrap:wrap; margin:26px 0 24px; }
.hero-actions.center{ justify-content:center; }

.hero-flag{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(201,168,76,.12); border:1px solid var(--border-gold);
  padding:6px 16px; border-radius:100px;
  font-size:.78rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--gold);
}
.hero-flag .dot{
  width:7px; height:7px; border-radius:50%; background:var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:.5; transform:scale(1.3); }
}

/* Signature element: the Pathway stepper */
.hero-visual{ display:flex; flex-direction:column; gap:18px; }
.pathway-card{
  background:var(--card); border:1px solid var(--border); border-radius:20px;
  padding:34px 28px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
.pathway-label{ font-size:.75rem; letter-spacing:2px; text-transform:uppercase; color:var(--text-muted); margin-bottom:26px; }
.pathway{ position:relative; display:flex; justify-content:space-between; margin:0; padding:0 4px; }
.pathway::before{
  content:''; position:absolute; top:9px; left:14px; right:14px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}
.pathway-step{ position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; flex:1; }
.pathway-node{
  width:19px; height:19px; border-radius:50%;
  background:var(--dark); border:2px solid var(--gold);
  box-shadow:0 0 0 5px rgba(201,168,76,.14);
}
.pathway-text{ font-size:.82rem; color:var(--text-muted); font-weight:500; }

.ticker-wrap{
  background:var(--dark3); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; height:46px; position:relative;
}
.ticker-track{
  display:flex; gap:32px; white-space:nowrap; position:absolute; inset:0;
  align-items:center; padding-left:100%;
  animation:ticker 25s linear infinite;
  font-size:.85rem; font-weight:500;
}
@keyframes ticker{ from{ transform:translateX(0);} to{ transform:translateX(-100%);} }
.tick{ display:inline-flex; gap:8px; color:var(--text); }
.tick .up{ color:var(--green); }
.tick .down{ color:var(--red); }
.ticker-note{ font-size:.72rem; color:var(--text-muted); margin:-6px 0 0; }

/* =========================================================
   Sections & Cards
   ========================================================= */
.section{ padding:90px 0; position:relative; z-index:1; }
.section-alt{ background:var(--dark2); }
.section-dark{ background:var(--dark2); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.section-head{ max-width:640px; margin:0 auto 48px; text-align:center; }
.section-head p{ font-size:1.05rem; }

.grid{ display:grid; gap:24px; }
.grid-2{ grid-template-columns:repeat(2, 1fr); }
.grid-3{ grid-template-columns:repeat(3, 1fr); }
.grid-4{ grid-template-columns:repeat(4, 1fr); }

.card{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:32px 28px; position:relative; overflow:hidden;
  transition:transform .3s ease, border-color .3s ease, background .3s ease;
}
.card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--gold), transparent);
  opacity:0; transition:opacity .3s ease;
}
.card:hover{ transform:translateY(-6px); border-color:var(--border-gold); background:var(--card-hover); }
.card:hover::before{ opacity:1; }
.card-icon{
  width:48px; height:48px; background:rgba(201,168,76,.1); border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-bottom:20px;
  color:var(--gold);
}
.card-icon svg{ width:24px; height:24px; }
.card-sm{ padding:26px; }
.card h3{ margin-bottom:.4em; }
.card p{ margin:0; font-size:.93rem; line-height:1.65; }

.badge{
  display:inline-block; margin-top:12px; font-size:.72rem; font-weight:700;
  letter-spacing:.5px; text-transform:uppercase; color:var(--gold);
  background:rgba(201,168,76,.12); border:1px solid var(--border-gold);
  padding:5px 12px; border-radius:100px;
}

.center-cta{ text-align:center; margin-top:40px; }
.section-note{ text-align:center; color:var(--text-muted); font-size:.9rem; margin-top:10px; }

/* =========================================================
   Course section
   ========================================================= */
.course-layout{ display:grid; grid-template-columns:1.3fr .9fr; gap:44px; align-items:start; }
.curriculum{ display:flex; flex-direction:column; gap:4px; }
.curriculum-item{
  display:flex; gap:20px; align-items:flex-start;
  background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px;
  transition:border-color .3s ease, background .3s ease;
}
.curriculum-item:hover{ border-color:var(--border-gold); background:rgba(201,168,76,.06); }
.curriculum-num{
  width:36px; height:36px; flex-shrink:0;
  background:rgba(201,168,76,.12); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:.8rem; font-weight:700; color:var(--gold);
}
.curriculum-item h3{ margin-bottom:.25em; font-size:1rem; }
.curriculum-item p{ margin:0; font-size:.87rem; }

.price-card{
  background:var(--card); border:1px solid var(--border-gold); border-radius:24px;
  padding:44px 40px; position:sticky; top:100px; text-align:left;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  overflow:hidden;
}
.price-card::before{
  content:''; position:absolute; top:-60px; right:-60px; width:200px; height:200px;
  background:radial-gradient(circle, rgba(201,168,76,.12), transparent 70%); pointer-events:none;
}
.price-tag{
  display:inline-block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  color:#000; background:var(--gold); padding:5px 14px; border-radius:100px; margin-bottom:16px;
}
.price{ font-family:var(--font-display); font-size:3.2rem; font-weight:900; color:var(--gold); margin:.2em 0 .1em; line-height:1; }
.price span{ font-size:1rem; color:var(--text-muted); font-weight:400; font-family:var(--font-body); }
.price-note{ font-size:.9rem; color:var(--text-muted); margin-bottom:24px; }
.price-list{ display:flex; flex-direction:column; gap:0; margin-bottom:28px; }
.price-list li{
  font-size:.95rem; color:var(--text); padding:10px 0; padding-left:26px; position:relative;
  border-bottom:1px solid var(--border);
}
.price-list li::before{ content:'✓'; position:absolute; left:0; color:var(--green); font-weight:700; }
.fine-print{ font-size:.8rem; color:var(--text-muted); text-align:center; margin-top:14px; }
.fine-print.center{ text-align:center; }

.disclaimer{
  text-align:center; font-size:.85rem; color:var(--text-muted); margin-top:40px;
  border-top:1px solid var(--border); padding-top:22px;
}

/* =========================================================
   Books
   ========================================================= */
.book-card{
  display:flex; gap:22px; background:var(--card); border:1px solid var(--border);
  border-radius:16px; padding:26px;
  transition:border-color .3s ease;
}
.book-card:hover{ border-color:var(--border-gold); }
.book-cover{ width:120px; height:170px; flex-shrink:0; border-radius:10px; object-fit:cover; }
.book-info h3{ margin-bottom:.35em; font-family:var(--font-display); color:var(--gold); font-size:1.15rem; }
.book-info p{ font-size:.92rem; }

/* =========================================================
   Platform / Waitlist
   ========================================================= */
.waitlist-form, .lead-form{ display:flex; gap:12px; max-width:480px; margin:0 auto; flex-wrap:wrap; }
.waitlist-form input, .lead-form input{
  flex:1; min-width:200px; padding:14px 18px; border-radius:100px;
  border:1px solid var(--border); background:var(--dark3); color:var(--text); font-family:var(--font-body);
}
.waitlist-form input:focus, .lead-form input:focus{ border-color:var(--gold); }
.form-status{ text-align:center; font-size:.85rem; color:var(--green); min-height:1.4em; margin-top:14px; }

/* =========================================================
   Founder (instructor style)
   ========================================================= */
.founder-layout{ display:grid; grid-template-columns:380px 1fr; gap:60px; align-items:center; }
.founder-photo{
  width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:20px;
  filter:grayscale(15%);
}
.founder-role{ color:var(--gold); font-weight:600; font-size:.9rem; margin-bottom:18px; }
.founder-tags{ display:flex; flex-wrap:wrap; gap:12px; margin:18px 0; }
.founder-tags li{
  display:flex; align-items:center; gap:8px;
  font-size:.87rem; font-weight:500; color:var(--text);
  background:var(--card); border:1px solid var(--border);
  padding:12px 18px; border-radius:10px;
}
.founder-links{ display:flex; gap:20px; margin-top:8px; }
.founder-links a{ color:var(--gold); font-weight:700; font-size:.92rem; }
.founder-links a:hover{ text-decoration:underline; }

/* =========================================================
   Lead gen
   ========================================================= */
.lead-gen{
  display:grid; grid-template-columns:1.2fr 1fr; gap:44px; align-items:center;
  background:var(--card); border:1px solid var(--border-gold); border-radius:24px; padding:48px;
}
.lead-gen h2{ margin-bottom:.3em; }

/* =========================================================
   FAQ / Accordion (matches faq-q / faq-icon behaviour)
   ========================================================= */
.accordion-item{ border-bottom:1px solid var(--border); }
.accordion-trigger{
  width:100%; text-align:left; background:none; border:none; color:var(--text);
  font-family:var(--font-body); font-size:1.02rem; font-weight:500;
  padding:22px 0; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:20px;
  transition:color .3s ease;
}
.accordion-trigger:hover{ color:var(--gold); }
.accordion-trigger::after{
  content:'+';
  width:28px; height:28px; border-radius:50%;
  background:rgba(255,255,255,.05);
  display:flex; align-items:center; justify-content:center;
  font-size:1.2rem; color:var(--text); flex-shrink:0;
  transition:background .3s ease, transform .3s ease, color .3s ease;
}
.accordion-trigger[aria-expanded="true"]::after{
  background:rgba(201,168,76,.15); color:var(--gold); transform:rotate(45deg);
}
.accordion-panel{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
.accordion-panel p{ padding:0 0 22px; margin:0; font-size:.95rem; line-height:1.7; }

/* =========================================================
   Final CTA
   ========================================================= */
.final-cta{ text-align:center; }
.final-cta p{ font-size:1.15rem; font-family:var(--font-display); color:var(--text); }

/* =========================================================
   Footer
   ========================================================= */
.site-footer{ background:var(--dark3); border-top:1px solid var(--border); padding:60px 0 30px; }
.footer-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:36px; }
.footer-brand .tagline{ font-size:.88rem; color:var(--text-muted); margin-top:8px; }
.footer-col h4{ font-size:.85rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:16px; }
.footer-col ul{ display:flex; flex-direction:column; gap:11px; }
.footer-col a{ font-size:.9rem; color:var(--text-muted); transition:color .3s ease; }
.footer-col a:hover{ color:var(--gold); }
.footer-bottom{ margin-top:44px; padding-top:26px; border-top:1px solid var(--border); font-size:.8rem; color:var(--text-muted); }
.footer-bottom .disclaimer{ border:none; padding:0; margin-top:10px; text-align:left; }

/* =========================================================
   Responsive
   ========================================================= */
@media (max-width: 1000px){
  .hero-inner{ grid-template-columns:1fr; }
  .course-layout{ grid-template-columns:1fr; }
  .price-card{ position:static; }
  .founder-layout{ grid-template-columns:1fr; text-align:center; }
  .founder-photo{ max-width:240px; margin:0 auto; }
  .founder-links{ justify-content:center; }
  .founder-tags{ justify-content:center; }
  .lead-gen{ grid-template-columns:1fr; text-align:center; }
  .lead-form{ margin:0 auto; }
  .grid-4{ grid-template-columns:repeat(2, 1fr); }
  .footer-grid{ grid-template-columns:1fr 1fr; }
}

@media (max-width: 760px){
  .nav-toggle{ display:flex; }
  .nav-menu{
    position:fixed; top:66px; left:0; right:0;
    height:calc(100vh - 66px); height:calc(100dvh - 66px);
    background:var(--dark); border-top:1px solid var(--border);
    flex-direction:column; align-items:flex-start; padding:28px 24px; gap:24px;
    transform:translateX(100%); transition:transform .25s ease; overflow-y:auto;
  }
  .nav-menu.open{ transform:translateX(0); }
  .nav-links{ flex-direction:column; gap:18px; width:100%; }
  .nav-links a{ font-size:1.05rem; }
  .nav-cta{ width:100%; text-align:center; }

  .grid-2, .grid-3, .grid-4{ grid-template-columns:1fr; }
  .book-card{ flex-directio
